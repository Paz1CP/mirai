name: CodeQL

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "25 7 * * 1"
  workflow_call:

jobs:
  analyze:
    name: CodeQL JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
          output: codeql-sarif
          upload: always
      - name: Gate high and critical security findings
        if: github.event_name == 'push'
        run: |
          count="$(jq -s '
            [.[].runs[] | . as $run | .results[]
            | .ruleId as $id
            | [$run.tool.driver.rules[]? | select(.id == $id)
              | (.properties["security-severity"] | tonumber? // 0)] | max // 0
            | select(. >= 7)] | length
          ' codeql-sarif/*.sarif)"
          printf 'CodeQL high or critical security findings: %s\n' "$count" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$count" -eq 0
