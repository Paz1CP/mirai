name: Verify Google Cloud authentication

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    name: Federate and read Google Cloud metadata
    if: ${{ github.repository == 'Paz1CP/mirai' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/gcp-auth
        with:
          project-id: ${{ vars.GCP_PROJECT_ID }}
          workload-identity-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service-account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Verify impersonation and authorized metadata reads
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          REGISTRY: ${{ vars.GCP_ARTIFACT_REGISTRY }}
          API_SERVICE: ${{ vars.MIRAI_API_SERVICE }}
          WEB_SERVICE: ${{ vars.MIRAI_WEB_SERVICE }}
          API_ORIGIN: ${{ vars.MIRAI_API_ORIGIN }}
          WEB_ORIGIN: ${{ vars.MIRAI_WEB_ORIGIN }}
        run: |
          gcloud auth print-access-token >/dev/null
          test "$(gcloud auth list --filter=status:ACTIVE --format='value(account)')" = "$ACCOUNT"
          test "$(gcloud config get-value project)" = "$PROJECT"
          printf 'Impersonated %s in %s.\n' "$ACCOUNT" "$PROJECT"

          test "$(gcloud run services describe "$API_SERVICE" --project="$PROJECT" --region="$REGION" --format='value(status.url)')" = "$API_ORIGIN"
          test "$(gcloud run services describe "$WEB_SERVICE" --project="$PROJECT" --region="$REGION" --format='value(status.url)')" = "$WEB_ORIGIN"
          printf 'Read Cloud Run metadata for %s and %s.\n' "$API_SERVICE" "$WEB_SERVICE"

          gcloud artifacts repositories describe "${REGISTRY##*/}" --project="$PROJECT" --location="$REGION" --format='value(name)'
          gcloud artifacts docker images list "$REGISTRY" --limit=1 --format='value(package)'
          gcloud storage buckets describe "gs://${PROJECT}_cloudbuild" --format='value(name)'
