steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - apps/${_APP}/Dockerfile
      - --build-arg
      - NEXT_PUBLIC_API_ORIGIN=${_API_ORIGIN}
      - --tag
      - us-east4-docker.pkg.dev/$PROJECT_ID/mirai/mirai-${_APP}:${_TAG}
      - .
images:
  - us-east4-docker.pkg.dev/$PROJECT_ID/mirai/mirai-${_APP}:${_TAG}
substitutions:
  _APP: api
  _TAG: setup
  _API_ORIGIN: https://mirai-api-4nag7kzycq-uk.a.run.app
options:
  logging: CLOUD_LOGGING_ONLY
